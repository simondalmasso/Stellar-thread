[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmic-listener"
version = "0.1.0"
description = "Stellar-thread distributed SETI listener and deterministic DSP lab"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14"]
license = {text = "MIT"}

[project.optional-dependencies]
authentic = ["blimpy>=2.1.4", "h5py>=3.11", "astropy>=6.1"]

[project.scripts]
cosmic-listener = "cosmic_listener.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cosmic_listener*"]
