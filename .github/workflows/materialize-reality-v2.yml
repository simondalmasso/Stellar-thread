name: Materialize Reality V2 source
on:
  push:
    branches: [agent/stellar-thread-complete-product]
    paths: [.reality-v2/ready]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stellar-thread-complete-product
          fetch-depth: 0
      - name: Verify and materialize audited source
        run: |
          cp -a .github/workflows /tmp/current-workflows
          cat .reality-v2/part-* > /tmp/reality-v2.tar.gz.b64
          echo 'fbbdeee512198ad077d15c94c378dc8f99ec20abb8102acee526b4130a6b460a  /tmp/reality-v2.tar.gz.b64' | sha256sum --check -
          base64 --decode /tmp/reality-v2.tar.gz.b64 > /tmp/reality-v2.tar.gz
          echo 'e0c9cdc757e44a5f051daeffb2e08fea6156062b1e4e1042dbfd5f9cc5038b46  /tmp/reality-v2.tar.gz' | sha256sum --check -
          tar -xzf /tmp/reality-v2.tar.gz -C .
          rm -rf .github/workflows
          mkdir -p .github
          cp -a /tmp/current-workflows .github/workflows
          rm -rf .reality-v2 source-head.txt source-tree.txt
          git config user.name 'stellar-thread-arq'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet -- .github/workflows
          git commit -m 'feat: implement Reality V2 persistent propagation product'
          git push origin HEAD:agent/stellar-thread-complete-product
