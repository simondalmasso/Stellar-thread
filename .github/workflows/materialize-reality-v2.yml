name: Materialize Reality V2 source
on:
  push:
    branches: [agent/stellar-thread-complete-product]
    paths: [.reality-v2/source.tar.gz.b64]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stellar-thread-complete-product
          fetch-depth: 0
      - name: Verify and materialize audited source
        run: |
          base64 --decode .reality-v2/source.tar.gz.b64 > /tmp/reality-v2.tar.gz
          echo 'e0c9cdc757e44a5f051daeffb2e08fea6156062b1e4e1042dbfd5f9cc5038b46  /tmp/reality-v2.tar.gz' | sha256sum --check -
          tar -xzf /tmp/reality-v2.tar.gz -C .
          rm -rf .reality-v2 .github/workflows/materialize-reality-v2.yml source-head.txt source-tree.txt
          git config user.name 'stellar-thread-arq'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: implement Reality V2 persistent propagation product'
          git push origin HEAD:agent/stellar-thread-complete-product
