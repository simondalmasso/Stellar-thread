name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
jobs:
  source-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SOURCE_SHA }}', fetch-depth: 0 }
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Check whitespace errors in proposed diff
        run: git diff --check origin/main...HEAD
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: node scripts/check-doc-links.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:manifest
      - run: mkdir -p artifacts/source-provenance && git rev-parse HEAD > artifacts/source-provenance/head.txt && git rev-parse HEAD^{tree} > artifacts/source-provenance/tree.txt && cp artifacts/build-manifest.json artifacts/source-provenance/
      - run: node scripts/artifact-context.mjs artifacts/source-provenance source-provenance
      - uses: actions/upload-artifact@v4
        with: { name: 'source-provenance-${{ env.SOURCE_SHA }}', path: artifacts/source-provenance }
  d1-migration-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SOURCE_SHA }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p artifacts/d1-migration-upgrade && node tests/d1-migrations.mjs | tee artifacts/d1-migration-upgrade/result.txt
      - run: node scripts/artifact-context.mjs artifacts/d1-migration-upgrade d1-migration-upgrade
      - uses: actions/upload-artifact@v4
        with: { name: 'd1-migration-upgrade-${{ env.SOURCE_SHA }}', path: artifacts/d1-migration-upgrade }
  web-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SOURCE_SHA }}', fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run test:core
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:manifest
        env: { SOURCE_SHA: '${{ env.SOURCE_SHA }}' }
      - name: Validate zero-cost static deployment config
        run: node scripts/render-wrangler-free.mjs
        env: { BUILD_SOURCE_SHA: '${{ env.SOURCE_SHA }}' }
      - name: Test Worker-first API routing
        run: node --test tests/free-deploy-routing.test.mjs
      - name: D1 Worker happy path and restart
        run: |
          mkdir -p artifacts/worker-integration
          npx wrangler d1 migrations apply DB --local --config wrangler.local.jsonc | tee artifacts/worker-integration/migrations.txt
          npx wrangler dev --local --config wrangler.local.jsonc --port 8787 --var APP_ENV:test --var OPERATOR_API_TOKEN:test-operator-token --var BUILD_SOURCE_SHA:$SOURCE_SHA --var BUILD_TREE_SHA:$(git rev-parse HEAD^{tree}) --var BUILD_TIME_UTC:2026-08-07T05:00:00.000Z > artifacts/worker-integration/first.log 2>&1 &
          P=$!; for i in {1..45}; do curl -fsS http://127.0.0.1:8787/api/v1/health >/dev/null && break || sleep 1; done
          npm run test:worker
          kill $P 2>/dev/null || true; wait $P 2>/dev/null || true
          npx wrangler dev --local --config wrangler.local.jsonc --port 8787 --var APP_ENV:test --var OPERATOR_API_TOKEN:test-operator-token --var BUILD_SOURCE_SHA:$SOURCE_SHA --var BUILD_TREE_SHA:$(git rev-parse HEAD^{tree}) --var BUILD_TIME_UTC:2026-08-07T05:00:00.000Z > artifacts/worker-integration/restart.log 2>&1 &
          P=$!; for i in {1..45}; do curl -fsS http://127.0.0.1:8787/api/v1/health >/dev/null && break || sleep 1; done
          node tests/worker-reload.mjs
          kill $P 2>/dev/null || true; wait $P 2>/dev/null || true
      - run: node scripts/artifact-context.mjs artifacts/worker-integration worker-integration
      - run: npx playwright install --with-deps chromium && npm run test:e2e
      - run: node scripts/artifact-context.mjs artifacts/ux-evidence ux-evidence
      - run: mkdir -p artifacts/frontend-d1-e2e artifacts/production && cp -R playwright-report/. artifacts/frontend-d1-e2e/ 2>/dev/null || true && cp -R dist package-lock.json artifacts/build-manifest.json artifacts/production/
      - run: node scripts/artifact-context.mjs artifacts/frontend-d1-e2e frontend-d1-e2e && node scripts/artifact-context.mjs artifacts/production production
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'worker-integration-${{ env.SOURCE_SHA }}', path: artifacts/worker-integration }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'frontend-d1-e2e-${{ env.SOURCE_SHA }}', path: artifacts/frontend-d1-e2e }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'ux-evidence-${{ env.SOURCE_SHA }}', path: artifacts/ux-evidence }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'production-${{ env.SOURCE_SHA }}', path: artifacts/production }
  dsp-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SOURCE_SHA }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip }
      - run: python -m pip install -c listener/constraints.txt -e ./listener
      - run: npm run test:python
      - run: mkdir -p artifacts/synthetic-dsp && cosmic-listener doctor && cosmic-listener observe --synthetic --duration 4 --output artifacts/synthetic-dsp/candidate.json
      - run: node scripts/artifact-context.mjs artifacts/synthetic-dsp synthetic-dsp
      - uses: actions/upload-artifact@v4
        with: { name: 'synthetic-dsp-${{ env.SOURCE_SHA }}', path: artifacts/synthetic-dsp }
  authentic-voyager-derived:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SOURCE_SHA }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip }
      - run: python -m pip install -c listener/constraints.txt numpy h5py hdf5plugin
      - name: Download pinned public Voyager control
        run: |
          mkdir -p source artifacts/authentic-voyager-derived
          curl --fail --location --retry 3 --connect-timeout 30 https://blpd0.ssl.berkeley.edu/Voyager_data/Voyager1.single_coarse.fine_res.h5 -o source/Voyager1.single_coarse.fine_res.h5 \
          || curl --fail --location --retry 3 --connect-timeout 30 http://blpd0.ssl.berkeley.edu/Voyager_data/Voyager1.single_coarse.fine_res.h5 -o source/Voyager1.single_coarse.fine_res.h5
      - run: echo 'c9a9a54f4140e3754ffb2455fae4eeb2eb70c8207123116ee953e4fce15c36ac  source/Voyager1.single_coarse.fine_res.h5' | sha256sum --check -
      - run: python listener/scripts/derive_voyager.py source/Voyager1.single_coarse.fine_res.h5 --out artifacts/authentic-voyager-derived
      - run: diff -u data/authentic/voyager1-control-manifest.json artifacts/authentic-voyager-derived/manifest.json && diff -u data/authentic/voyager-control-preview.json artifacts/authentic-voyager-derived/voyager-control-preview.json && cmp data/authentic/voyager-control-preview.json src/data/voyager-control-preview.generated.json
      - run: echo '4b8c12fc87a59c91a0155d9f65298c2b145586b1ca96ddd4e69d342036b8c7f1  artifacts/authentic-voyager-derived/voyager-control-waterfall.npy' | sha256sum --check - && echo 'e7e0dc18ecfd5f71537649f991e071d6abef1d5ead19aba31c27fbbfe9c3197e  artifacts/authentic-voyager-derived/voyager-control-preview.json' | sha256sum --check -
      - run: node scripts/artifact-context.mjs artifacts/authentic-voyager-derived authentic-voyager-derived
      - uses: actions/upload-artifact@v4
        with: { name: 'authentic-voyager-derived-${{ env.SOURCE_SHA }}', path: artifacts/authentic-voyager-derived }
  research-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SOURCE_SHA }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run catalog:verify
      - run: npm run test:core
      - run: npm run audit:secrets && npm run licenses && node scripts/deploy-config-audit.mjs
      - run: mkdir -p artifacts/research-security && cp -R data/catalog data/eme artifacts/research-security/
      - run: node scripts/artifact-context.mjs artifacts/research-security research-security
      - uses: actions/upload-artifact@v4
        with: { name: 'research-security-${{ env.SOURCE_SHA }}', path: artifacts/research-security }
  merge-verification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund && npm run test:core && npm run typecheck && npm run build
      - run: mkdir -p artifacts/merge-verification && printf '{"mergeSha":"%s","headSha":"%s"}\n' "$(git rev-parse HEAD)" "$SOURCE_SHA" > artifacts/merge-verification/merge.json
      - run: node scripts/artifact-context.mjs artifacts/merge-verification merge-verification
      - uses: actions/upload-artifact@v4
        with: { name: 'merge-verification-${{ env.SOURCE_SHA }}', path: artifacts/merge-verification }
