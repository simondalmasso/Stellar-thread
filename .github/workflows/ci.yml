name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npm run test:core
      - run: npm run typecheck
      - run: npm run build
      - run: npm run audit:secrets
      - run: npm run licenses
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: stellar-thread-web-${{ github.sha }}
          path: |
            dist
            artifacts/license-inventory.json
            playwright-report
          if-no-files-found: ignore
  dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./listener
      - run: python -m unittest discover -s listener/tests -p 'test_*.py' -v
      - run: cosmic-listener doctor
      - run: mkdir -p artifacts && cosmic-listener observe --synthetic --duration 4 --output artifacts/synthetic-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: stellar-thread-dsp-${{ github.sha }}
          path: artifacts/synthetic-candidate.json
